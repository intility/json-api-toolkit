version: 2

updates:
  # NuGet packages
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - nuget
    commit-message:
      prefix: "deps(nuget)"
    groups:
      # Group minor/patch updates to reduce PR noise
      microsoft:
        patterns:
          - "Microsoft.*"
        update-types:
          - minor
          - patch
      testing:
        patterns:
          - "xunit*"
          - "Moq*"
          - "coverlet*"
        update-types:
          - minor
          - patch

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "deps(actions)"
