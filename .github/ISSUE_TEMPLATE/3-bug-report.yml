name: 🐛 Bug Report
description: File a bug report.
labels: ['bug']
type: Bug
projects: ['intility/56']
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you observe, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal repro steps. Code snippet, request, or test case if possible.
      render: csharp
    validations:
      required: true
  - type: input
    id: toolkit-version
    attributes:
      label: JsonApiToolkit version
      placeholder: e.g. 2.1.0
    validations:
      required: true
  - type: input
    id: dotnet-version
    attributes:
      label: .NET version
      placeholder: e.g. 10.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Optional. Paste relevant log output. Formatting is automatic.
      render: shell
