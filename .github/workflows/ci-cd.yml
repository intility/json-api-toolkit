name: CI/CD Pipeline

on:
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            dotnet:
              - 'JsonApiToolkit/**'
              - 'JsonApiToolkit.Tests/**'
              - 'samples/**'
              - 'JsonApiToolkit.sln'
              - 'Directory.Build.props'
              - 'global.json'
              - '.config/**'
              - '.github/workflows/ci-cd.yml'

  build-and-test:
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Check formatting
        run: |
          dotnet tool restore
          dotnet csharpier check .

      - name: Test
        run: dotnet test --configuration Release --verbosity normal --no-restore

  status:
    name: Build and Test
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    needs: [build-and-test]
    steps:
      - name: Check result
        run: |
          result="${{ needs.build-and-test.result }}"
          if [[ "$result" == "success" || "$result" == "skipped" ]]; then exit 0; fi
          exit 1

  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # OIDC token for NuGet trusted publishing

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build and Pack
        run: dotnet pack JsonApiToolkit/JsonApiToolkit.csproj -c Release --no-restore

      # Exchange OIDC token for a short-lived NuGet API key
      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        run: dotnet nuget push "JsonApiToolkit/bin/Release/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --skip-duplicate
