name: "Docs: Check & Deploy"

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yaml"
      - "JsonApiToolkit/**"
      - ".github/workflows/docs.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.head_ref ||
    'deploy' }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'mkdocs.yaml'
              - 'CHANGELOG.md'
              - 'JsonApiToolkit/**'
              - '.github/workflows/docs.yml'

  build:
    name: "Docs: Build"
    needs: changes
    if: always() && (needs.changes.result == 'skipped' || needs.changes.outputs.docs
      == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
          source-url: https://nuget.pkg.github.com/Intility/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          python-version: "3.13"

      - name: Build library (for API XML docs)
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet build JsonApiToolkit/JsonApiToolkit.csproj -c Release -o
          JsonApiToolkit/bin/docs

      - name: Install Intility.DotnetApiDocs
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet tool install -g Intility.DotnetApiDocs --version 0.1.5

      - name: Generate API reference
        run: dotnet-api-docs --input JsonApiToolkit/bin/docs --output docs/api --strict

      - name: Install Python dependencies
        run: uv venv && uv pip install -r docs/requirements.txt

      - name: Build Documentation
        run: uv run mkdocs build --strict

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "site"

  deploy:
    name: Deploy
    if: always() && needs.build.result == 'success' && github.event_name !=
      'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
